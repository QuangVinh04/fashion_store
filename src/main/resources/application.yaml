server:
  port: 8081
  servlet:
    context-path: /vinh

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

spring:
  application:
    name: clothes-retail-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/fashion_database?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true


  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:3600}       # in seconds
  refreshable-duration: ${JWT_REFRESH_DURATION:14} # in days

openapi:
  service:
    api-docs: fashion-api-service
    server: http://localhost:8081/vinh
    title: API Service
    version: v1.0.0

