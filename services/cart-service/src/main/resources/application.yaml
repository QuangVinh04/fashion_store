server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://${CART_POSTGRES_HOST:localhost}:${CART_POSTGRES_PORT:5436}/${CART_POSTGRES_DB:cart_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${CART_POSTGRES_USER:root}
    password: ${CART_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8082}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/api/v1/auth/jwks}

app:
  clients:
    product-base-url: ${PRODUCT_BASE_URL:http://localhost:8087}
    inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8086}

resilience4j:
  retry:
    instances:
      product-service:
        max-attempts: 3
        wait-duration: 500ms


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
