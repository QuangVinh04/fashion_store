server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: file-service
  datasource:
    url: jdbc:postgresql://${FILE_POSTGRES_HOST:localhost}:${FILE_POSTGRES_PORT:5437}/${FILE_POSTGRES_DB:file_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${FILE_POSTGRES_USER:root}
    password: ${FILE_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:25MB}
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8082}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/api/v1/auth/jwks}

app:
  storage:
    location: ${FILE_STORAGE_LOCATION:./storage/file-service}
    public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
