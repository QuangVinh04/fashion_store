server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${ORDER_POSTGRES_HOST:localhost}:${ORDER_POSTGRES_PORT:5437}/${ORDER_POSTGRES_DB:order_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${ORDER_POSTGRES_USER:root}
    password: ${ORDER_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8082}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/api/v1/auth/jwks}

app:
  clients:
    # product + inventory đã gộp thành catalog-service, chung một base URL.
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8087}
  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:15000}
  saga:
    # Deadline của từng bước nằm trong OrderSagaStep; ở đây chỉ là nhịp quét.
    timeout-scan-delay-ms: ${SAGA_TIMEOUT_SCAN_DELAY_MS:15000}
  checkout:
    # Hạn sống của một bản chụp giá, tính từ lúc tạo checkout.
    ttl-minutes: ${CHECKOUT_TTL_MINUTES:30}
    expiry-scan-delay-ms: ${CHECKOUT_EXPIRY_SCAN_DELAY_MS:300000}

resilience4j:
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 500ms
      inventoryService:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
      inventoryService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
