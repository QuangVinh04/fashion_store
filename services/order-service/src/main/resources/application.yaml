server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${ORDER_POSTGRES_HOST:localhost}:${ORDER_POSTGRES_PORT:5437}/${ORDER_POSTGRES_DB:order_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${ORDER_POSTGRES_USER:root}
    password: ${ORDER_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  clients:
    # product + inventory đã gộp thành catalog-service, chung một base URL.
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8087}
    identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8082}
  ghn:
    api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    from-district-id: ${GHN_FROM_DISTRICT_ID:1442}
    from-ward-code: ${GHN_FROM_WARD_CODE:20101}
    enabled: ${GHN_ENABLED:true}
    allow-mock: ${GHN_ALLOW_MOCK:false}
    webhook-token: ${GHN_WEBHOOK_TOKEN:fashion-store-ghn-webhook-secret}


  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:15000}
  saga:
    # Deadline của từng bước nằm trong OrderSagaStep; ở đây chỉ là nhịp quét.
    timeout-scan-delay-ms: ${SAGA_TIMEOUT_SCAN_DELAY_MS:15000}
  checkout:
    # Hạn sống của một bản chụp giá, tính từ lúc tạo checkout.
    ttl-minutes: ${CHECKOUT_TTL_MINUTES:30}
    expiry-scan-delay-ms: ${CHECKOUT_EXPIRY_SCAN_DELAY_MS:300000}

resilience4j:
  # product + inventory giờ là một service (catalog) nên cũng chỉ còn một circuit breaker: hai bên
  # sống chết cùng nhau, tách ra hai instance chỉ tạo cảm giác cô lập chứ không cô lập được gì.
  retry:
    instances:
      catalogService:
        max-attempts: 3
        wait-duration: 500ms
        # AppException = câu trả lời nghiệp vụ (variant không tồn tại), gọi lại 3 lần cũng thế.
        ignore-exceptions:
          - com.fashionstore.common.exception.AppException
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        # Khách hỏi variantId không tồn tại không phải là catalog đang lỗi -> đừng mở circuit vì nó.
        ignore-exceptions:
          - com.fashionstore.common.exception.AppException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
