server:
  port: ${SERVER_PORT:8089}

springdoc:
  paths-to-match: /api/**

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Keycloak: iss = URL browser thấy, JWKS lấy qua đường nội bộ (không dùng discovery)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
      client:
        # Service account (client_credentials) cho Feign gọi /internal/** của service khác
        registration:
          keycloak:
            provider: keycloak
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET:dev-order-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/token}
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${ORDER_POSTGRES_HOST:localhost}:${ORDER_POSTGRES_PORT:5437}/${ORDER_POSTGRES_DB:order_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${ORDER_POSTGRES_USER:root}
    password: ${ORDER_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fashion}
    password: ${RABBITMQ_PASSWORD:fashion-dev-password}
    # Publisher confirms + returns: relay outbox chỉ đánh dấu PUBLISHED khi broker đã ack và route được.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Số message broker đẩy trước cho mỗi consumer chưa ack; nhỏ để message không dồn vào một instance.
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  data:
    # RedisService là cách duy nhất dùng Redis và luôn fail-open: timeout thấp để Redis chết không làm chậm xử lý.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms

  jpa:
    open-in-view: false
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  returns:
    # Các hạn của vòng đời trả hàng, quét theo nhịp của auto-completion-delay-ms bên dưới.
    admin-review-sla-days: ${RETURN_ADMIN_REVIEW_SLA_DAYS:3}
    pickup-timeout-days: ${RETURN_PICKUP_TIMEOUT_DAYS:7}
    in-transit-alert-days: ${RETURN_IN_TRANSIT_ALERT_DAYS:14}
    arrival-receive-sla-days: ${RETURN_ARRIVAL_RECEIVE_SLA_DAYS:3}
    reconcile-interval-minutes: ${RETURN_RECONCILE_INTERVAL_MINUTES:30}
    pickup-cancel-max-attempts: ${RETURN_PICKUP_CANCEL_MAX_ATTEMPTS:5}
    batch-size: ${RETURN_SCAN_BATCH_SIZE:20}
  order:
    auto-completion-enabled: ${ORDER_AUTO_COMPLETION_ENABLED:true}
    auto-completion-delay-ms: ${ORDER_AUTO_COMPLETION_DELAY_MS:60000}
  clients:
    # product + inventory đã gộp thành catalog-service, chung một base URL.
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8087}
    identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8082}
  ghn:
    api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN}
    shop-id: ${GHN_SHOP_ID}
    enabled: ${GHN_ENABLED:true}
    allow-mock: ${GHN_ALLOW_MOCK:false}
    webhook-token: ${GHN_WEBHOOK_TOKEN:fashion-store-ghn-webhook-secret}
    # Kho nhận hàng trả (đầu "to" của đơn trả hàng qua GHN, địa chỉ kiểu mới: phường + tỉnh).
    return-warehouse:
      name: ${GHN_RETURN_WAREHOUSE_NAME:}
      phone: ${GHN_RETURN_WAREHOUSE_PHONE:}
      address: ${GHN_RETURN_WAREHOUSE_ADDRESS:}
      ward-name: ${GHN_RETURN_WAREHOUSE_WARD_NAME:}
      province-name: ${GHN_RETURN_WAREHOUSE_PROVINCE_NAME:}


  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:15000}
  saga:
    # Deadline của từng bước nằm trong OrderSagaStep; ở đây chỉ là nhịp quét.
    timeout-scan-delay-ms: ${SAGA_TIMEOUT_SCAN_DELAY_MS:15000}
  checkout:
    # Hạn sống của một bản chụp giá, tính từ lúc tạo checkout.
    ttl-minutes: ${CHECKOUT_TTL_MINUTES:30}
    expiry-scan-delay-ms: ${CHECKOUT_EXPIRY_SCAN_DELAY_MS:300000}

resilience4j:
  # product + inventory giờ là một service (catalog) nên cũng chỉ còn một circuit breaker: hai bên
  # sống chết cùng nhau, tách ra hai instance chỉ tạo cảm giác cô lập chứ không cô lập được gì.
  retry:
    instances:
      catalogService:
        max-attempts: 3
        wait-duration: 500ms
        # AppException = câu trả lời nghiệp vụ (variant không tồn tại), gọi lại 3 lần cũng thế.
        ignore-exceptions:
          - com.fashionstore.common.exception.AppException
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        # Khách hỏi variantId không tồn tại không phải là catalog đang lỗi -> đừng mở circuit vì nó.
        ignore-exceptions:
          - com.fashionstore.common.exception.AppException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
