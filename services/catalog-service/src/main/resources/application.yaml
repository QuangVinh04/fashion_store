server:
  port: ${SERVER_PORT:8087}

springdoc:
  paths-to-match: /api/**, /admin/**

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Keycloak: iss = URL browser thấy, JWKS lấy qua đường nội bộ (không dùng discovery)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
      client:
        # Service account (client_credentials) cho Feign gọi /internal/** của service khác
        registration:
          keycloak:
            provider: keycloak
            client-id: catalog-service
            client-secret: ${CATALOG_SERVICE_CLIENT_SECRET:dev-catalog-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/token}
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${CATALOG_POSTGRES_HOST:localhost}:${CATALOG_POSTGRES_PORT:5435}/${CATALOG_POSTGRES_DB:catalog_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${CATALOG_POSTGRES_USER:root}
    password: ${CATALOG_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  clients:
    order-base-url: ${ORDER_BASE_URL:http://localhost:8089}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:3000}
  storage:
    public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:8087}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:fashion-media}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY_SECONDS:900}
    max-upload-bytes: ${MINIO_MAX_UPLOAD_BYTES:20971520}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
