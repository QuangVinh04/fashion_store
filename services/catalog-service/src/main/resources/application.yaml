server:
  port: ${SERVER_PORT:8087}

springdoc:
  paths-to-match: /api/**, /admin/**

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Keycloak: iss = URL browser thấy, JWKS lấy qua đường nội bộ (không dùng discovery)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
      client:
        # Service account (client_credentials) cho Feign gọi /internal/** của service khác
        registration:
          keycloak:
            provider: keycloak
            client-id: catalog-service
            client-secret: ${CATALOG_SERVICE_CLIENT_SECRET:dev-catalog-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/token}
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${CATALOG_POSTGRES_HOST:localhost}:${CATALOG_POSTGRES_PORT:5435}/${CATALOG_POSTGRES_DB:catalog_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${CATALOG_POSTGRES_USER:root}
    password: ${CATALOG_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fashion}
    password: ${RABBITMQ_PASSWORD:fashion-dev-password}
    # Publisher confirms + returns: relay outbox chỉ đánh dấu PUBLISHED khi broker đã ack và route được.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Số message broker đẩy trước cho mỗi consumer chưa ack; nhỏ để message không dồn vào một instance.
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  data:
    # RedisService là cách duy nhất dùng Redis và luôn fail-open: timeout thấp để Redis chết không làm chậm xử lý.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  clients:
    order-base-url: ${ORDER_BASE_URL:http://localhost:8089}
    identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8082}
  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:15000}
  storage:
    public-base-url: ${FILE_PUBLIC_BASE_URL:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:fashion-media}
    evidence-bucket: ${MINIO_EVIDENCE_BUCKET:}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY_SECONDS:900}
    max-upload-bytes: ${MINIO_MAX_UPLOAD_BYTES:20971520}

resilience4j:
  # Mỗi downstream một breaker riêng. UpstreamFailure (common-library): chỉ 5xx / mất kết nối / timeout mới
  # tính là lỗi và được retry; 4xx, AppException và circuit đang mở thì không.
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exception-predicate: com.fashionstore.common.resilience.UpstreamFailure
    instances:
      orderService:
        base-config: default
      identityService:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        record-failure-predicate: com.fashionstore.common.resilience.UpstreamFailure
    instances:
      orderService:
        base-config: default
      identityService:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
