server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_POSTGRES_HOST:localhost}:${PAYMENT_POSTGRES_PORT:5433}/${PAYMENT_POSTGRES_DB:payment_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${PAYMENT_POSTGRES_USER:root}
    password: ${PAYMENT_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8082}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/api/v1/auth/jwks}
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:5000}

payment:
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8085/api/v1/payments/vnpay/return}
    expiration-minutes: ${VNPAY_EXPIRATION_MINUTES:15}
  paypal:
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    currency: ${PAYPAL_CURRENCY:USD}
    vnd-per-currency-unit: ${PAYPAL_VND_PER_CURRENCY_UNIT:25000}
    return-url: ${PAYPAL_RETURN_URL:http://localhost:3000/payment/paypal/success}
    cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:3000/payment/paypal/cancel}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
