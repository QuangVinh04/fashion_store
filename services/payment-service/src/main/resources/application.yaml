server:
  port: ${SERVER_PORT:8085}

springdoc:
  paths-to-match: /api/**

spring:
  cloud:
    openfeign:
      client:
        config:
          vnpay-api:
            connectTimeout: 2000
            readTimeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Keycloak: iss = URL browser thấy, JWKS lấy qua đường nội bộ (không dùng discovery)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: payment-service
            client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET:dev-payment-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/token}
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_POSTGRES_HOST:localhost}:${PAYMENT_POSTGRES_PORT:5433}/${PAYMENT_POSTGRES_DB:payment_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${PAYMENT_POSTGRES_USER:root}
    password: ${PAYMENT_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fashion}
    password: ${RABBITMQ_PASSWORD:fashion-dev-password}
    # Publisher confirms + returns: relay outbox chỉ đánh dấu PUBLISHED khi broker đã ack và route được.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Số message broker đẩy trước cho mỗi consumer chưa ack; nhỏ để message không dồn vào một instance.
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  data:
    # RedisService là cách duy nhất dùng Redis và luôn fail-open: timeout thấp để Redis chết không làm chậm xử lý.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:15000}

payment:
  wallet:
    checkout-origin: ${WALLET_CHECKOUT_ORIGIN:http://localhost:3000}
    top-up-enabled: ${WALLET_TOP_UP_ENABLED:false}
    # Initial store limits; verify provider account settings before enabling top-ups.
    min-top-up-amount: ${WALLET_MIN_TOP_UP_AMOUNT:10000}
    max-top-up-amount: ${WALLET_MAX_TOP_UP_AMOUNT:5000000}
    top-up-ttl-minutes: ${WALLET_TOP_UP_TTL_MINUTES:15}
    top-up-return-url: ${WALLET_TOP_UP_RETURN_URL:http://localhost:3000/profile/wallet/top-up}
    top-up-cancel-url: ${WALLET_TOP_UP_CANCEL_URL:http://localhost:3000/profile/wallet/top-up}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:30000}
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8083/payment/vnpay/return}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn}
    server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
    expiration-minutes: ${VNPAY_EXPIRATION_MINUTES:15}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:8083/payment/payos/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:8083/payment/payos/cancel}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
