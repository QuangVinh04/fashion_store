server:
  port: ${SERVER_PORT:8085}

springdoc:
  paths-to-match: /api/**

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_POSTGRES_HOST:localhost}:${PAYMENT_POSTGRES_PORT:5433}/${PAYMENT_POSTGRES_DB:payment_database}?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${PAYMENT_POSTGRES_USER:root}
    password: ${PAYMENT_POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:15000}

payment:
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8085/api/v1/payments/vnpay/return}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn}
    create-by: ${VNPAY_REFUND_CREATE_BY:fashion-store}
    server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
    expiration-minutes: ${VNPAY_EXPIRATION_MINUTES:15}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/payos/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/payos/cancel}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
