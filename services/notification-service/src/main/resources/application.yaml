server:
  port: ${SERVER_PORT:8090}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${NOTIFICATION_POSTGRES_HOST:localhost}:${NOTIFICATION_POSTGRES_PORT:5439}/${NOTIFICATION_POSTGRES_DB:notification_database}
    username: ${NOTIFICATION_POSTGRES_USER:root}
    password: ${NOTIFICATION_POSTGRES_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fashion}
    password: ${RABBITMQ_PASSWORD:fashion-dev-password}
    listener:
      simple:
        # Số message broker đẩy trước cho mỗi consumer chưa ack; nhỏ để message không dồn vào một instance.
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  data:
    # RedisService là cách duy nhất dùng Redis và luôn fail-open: timeout thấp để Redis chết không làm chậm xử lý.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

app:
  websocket:
    allowed-origins: ${NOTIFICATION_ALLOWED_ORIGINS:http://localhost:8083,http://127.0.0.1:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
