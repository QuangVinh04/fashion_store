server:
  port: ${SERVER_PORT:8082}

springdoc:
  paths-to-match: /api/**

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Keycloak: iss = URL browser thấy, JWKS lấy qua đường nội bộ (không dùng discovery)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${IDENTITY_POSTGRES_HOST:localhost}:${IDENTITY_POSTGRES_PORT:5438}/${IDENTITY_POSTGRES_DB:identity_database}
    username: ${IDENTITY_POSTGRES_USER:root}
    password: ${IDENTITY_POSTGRES_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

app:
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
