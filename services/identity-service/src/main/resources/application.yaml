server:
  port: ${SERVER_PORT:8082}

springdoc:
  paths-to-match: /api/**

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Keycloak: iss = URL browser thấy, JWKS lấy qua đường nội bộ (không dùng discovery)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fashion-store}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/certs}
          audiences: fashion-api
      client:
        # Service account (client_credentials) cho Keycloak Admin API: khoá / mở khoá, huỷ phiên của user
        registration:
          keycloak:
            provider: keycloak
            client-id: identity-service
            client-secret: ${IDENTITY_SERVICE_CLIENT_SECRET:dev-identity-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/fashion-store/protocol/openid-connect/token}
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${IDENTITY_POSTGRES_HOST:localhost}:${IDENTITY_POSTGRES_PORT:5438}/${IDENTITY_POSTGRES_DB:identity_database}
    username: ${IDENTITY_POSTGRES_USER:root}
    password: ${IDENTITY_POSTGRES_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fashion}
    password: ${RABBITMQ_PASSWORD:fashion-dev-password}
    # Publisher confirms + returns: relay outbox chỉ đánh dấu PUBLISHED khi broker đã ack và route được.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

app:
  keycloak:
    admin-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180/admin/realms/fashion-store}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8087}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:3000}

resilience4j:
  # Mỗi downstream một breaker riêng. UpstreamFailure (common-library): chỉ 5xx / mất kết nối / timeout mới
  # tính là lỗi và được retry; 4xx, AppException và circuit đang mở thì không.
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exception-predicate: com.fashionstore.common.resilience.UpstreamFailure
    instances:
      catalogService:
        base-config: default
      keycloakAdmin:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        record-failure-predicate: com.fashionstore.common.resilience.UpstreamFailure
    instances:
      catalogService:
        base-config: default
      keycloakAdmin:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
