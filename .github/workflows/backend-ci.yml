name: Backend CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Maven reactor
        run: ./mvnw -B verify
      - name: Validate Docker Compose
        run: docker compose config --quiet
