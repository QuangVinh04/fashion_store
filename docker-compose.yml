name: fashion-store

x-service-environment: &service-environment
  KEYCLOAK_ISSUER: http://localhost:8180/realms/fashion-store
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/fashion-store/protocol/openid-connect/certs
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/fashion-store/protocol/openid-connect/token

services:
  api-gateway:
    build:
      context: platform/gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/fashion-store
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/fashion-store/protocol/openid-connect/certs
      IDENTITY_BASE_URL: http://identity-service:8082
      CATALOG_BASE_URL: http://catalog-service:8087
      ORDER_BASE_URL: http://order-service:8089
      PAYMENT_BASE_URL: http://payment-service:8085
    depends_on:
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"   # Bearer cho Swagger/dev; browser đi qua BFF
    networks:
      - fashion-network

  storefront-bff:
    build:
      context: platform/storefront-bff
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8083
      API_GATEWAY_URL: http://api-gateway:8080
      STOREFRONT_UI_URL: ${STOREFRONT_UI_URL:-http://host.docker.internal:3000}
      KEYCLOAK_PUBLIC_URL: http://localhost:8180/realms/fashion-store
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/fashion-store
      STOREFRONT_BFF_CLIENT_SECRET: ${STOREFRONT_BFF_CLIENT_SECRET:-dev-storefront-bff-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"   # UI dev server chạy trên máy host
    depends_on:
      api-gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - fashion-network

  backoffice-bff:
    build:
      context: platform/backoffice-bff
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      API_GATEWAY_URL: http://api-gateway:8080
      BACKOFFICE_UI_URL: ${BACKOFFICE_UI_URL:-http://host.docker.internal:5173}
      KEYCLOAK_PUBLIC_URL: http://localhost:8180/realms/fashion-store
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/fashion-store
      BACKOFFICE_BFF_CLIENT_SECRET: ${BACKOFFICE_BFF_CLIENT_SECRET:-dev-backoffice-bff-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"   # UI dev server chạy trên máy host
    depends_on:
      api-gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8084:8084"
    networks:
      - fashion-network


  identity-service:
    build:
      context: services/identity-service
      dockerfile: Dockerfile
    environment:
      <<: *service-environment
      SERVER_PORT: 8082
      IDENTITY_POSTGRES_HOST: identity-postgres
      IDENTITY_POSTGRES_PORT: 5432
      IDENTITY_POSTGRES_DB: identity_database
      IDENTITY_POSTGRES_USER: root
      IDENTITY_POSTGRES_PASSWORD: root
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    depends_on:
      identity-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8082"
    networks:
      - fashion-network

  notification-service:
    build:
      context: services/notification-service
      dockerfile: Dockerfile
    environment:
      <<: *service-environment
      SERVER_PORT: 8090
      NOTIFICATION_POSTGRES_HOST: notification-postgres
      NOTIFICATION_POSTGRES_PORT: 5432
      NOTIFICATION_POSTGRES_DB: notification_database
      NOTIFICATION_POSTGRES_USER: root
      NOTIFICATION_POSTGRES_PASSWORD: root
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8090"
    networks:
      - fashion-network

  catalog-service:
    build:
      context: services/catalog-service
      dockerfile: Dockerfile
    environment:
      <<: *service-environment
      SERVER_PORT: 8087
      CATALOG_SERVICE_CLIENT_SECRET: ${CATALOG_SERVICE_CLIENT_SECRET:-dev-catalog-service-secret}
      ORDER_BASE_URL: http://order-service:8089
      CATALOG_POSTGRES_HOST: catalog-postgres
      CATALOG_POSTGRES_PORT: 5432
      CATALOG_POSTGRES_DB: catalog_database
      CATALOG_POSTGRES_USER: root
      CATALOG_POSTGRES_PASSWORD: root
      FILE_PUBLIC_BASE_URL: http://localhost:8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: fashion-media
      MINIO_PRESIGN_EXPIRY_SECONDS: 900
      MINIO_MAX_UPLOAD_BYTES: 20971520
    depends_on:
      catalog-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8087"
    networks:
      - fashion-network

  order-service:
    build:
      context: services/order-service
      dockerfile: Dockerfile
    environment:
      <<: *service-environment
      SERVER_PORT: 8089
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:-dev-order-service-secret}
      ORDER_POSTGRES_HOST: order-postgres
      ORDER_POSTGRES_PORT: 5432
      ORDER_POSTGRES_DB: order_database
      ORDER_POSTGRES_USER: root
      ORDER_POSTGRES_PASSWORD: root
      CATALOG_BASE_URL: http://catalog-service:8087
    depends_on:
      order-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
    expose:
      - "8089"
    networks:
      - fashion-network

  payment-service:
    build:
      context: services/payment-service
      dockerfile: Dockerfile
    environment:
      <<: *service-environment
      SERVER_PORT: 8085
      PAYMENT_POSTGRES_HOST: payment-postgres
      PAYMENT_POSTGRES_PORT: 5432
      PAYMENT_POSTGRES_DB: payment_database
      PAYMENT_POSTGRES_USER: root
      PAYMENT_POSTGRES_PASSWORD: root
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay/return}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEMOTMN0}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-DEMOHASHSECRETKEY1234567890123}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8085"
    networks:
      - fashion-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_database
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      # iss của token = URL mà browser thấy; service gọi nội bộ qua http://keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Placeholder trong realm-fashion-store.json
      STOREFRONT_BFF_CLIENT_SECRET: ${STOREFRONT_BFF_CLIENT_SECRET:-dev-storefront-bff-secret}
      BACKOFFICE_BFF_CLIENT_SECRET: ${BACKOFFICE_BFF_CLIENT_SECRET:-dev-backoffice-bff-secret}
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:-dev-order-service-secret}
      CATALOG_SERVICE_CLIENT_SECRET: ${CATALOG_SERVICE_CLIENT_SECRET:-dev-catalog-service-secret}
      IDENTITY_SERVICE_CLIENT_SECRET: ${IDENTITY_SERVICE_CLIENT_SECRET:-dev-identity-service-secret}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-no-reply@fashion.local}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - "8180:8080"   # Trang đăng nhập — browser phải tới được
    volumes:
      - ./platform/keycloak/realm-fashion-store.json:/opt/keycloak/data/import/realm-fashion-store.json:ro
    networks:
      - fashion-network

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fashion-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: fashion_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Browser PUT thang len :9000 nen CORS phai mo o day, SecurityConfig cua catalog khong voi toi.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:5173"
    ports:
      - "9000:9000"   # S3 API — browser goi presigned URL vao day
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data
    networks:
      - fashion-network

  redis:
    image: redis:alpine
    container_name: fashion_redis
    ports:
      - "6379:6379"   # Port Redis
    volumes:
      - redis_data:/var/lib/redis
    networks:
      - fashion-network

  identity-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: identity_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck: &postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network

  notification-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck: *postgres-healthcheck
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network

  catalog-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck: *postgres-healthcheck
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network

  order-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: order_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck: *postgres-healthcheck
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network

  payment-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck: *postgres-healthcheck
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network

  keycloak-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck: *postgres-healthcheck
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - fashion-network

networks:
  fashion-network:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
  identity_postgres_data:
  notification_postgres_data:
  catalog_postgres_data:
  minio_data:
  order_postgres_data:
  payment_postgres_data:
  keycloak_postgres_data:
